<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="500" viewBox="0 0 1400 500">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#030508"/>
      <stop offset="50%" style="stop-color:#0a0f1a"/>
      <stop offset="100%" style="stop-color:#0f1a2e"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f0ff"/>
      <stop offset="50%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#00a8cc"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="hexClip">
      <polygon points="0,-50 43,-25 43,25 0,50 -43,25 -43,-25"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1400" height="500" fill="url(#bgGrad)"/>

  <!-- Animated grid -->
  <g stroke="#1a2f3e" stroke-width="1" opacity="0.5">
    <path d="M0,80 L1400,80 M0,160 L1400,160 M0,240 L1400,240 M0,320 L1400,320 M0,400 L1400,400 M0,480 L1400,480"/>
    <path d="M100,0 L100,500 M200,0 L200,500 M300,0 L300,500 M400,0 L400,500 M500,0 L500,500 M600,0 L600,500 M700,0 L700,500 M800,0 L800,500 M900,0 L900,500 M1000,0 L1000,500 M1100,0 L1100,500 M1200,0 L1200,500 M1300,0 L1300,500"/>
  </g>

  <!-- Glowing floor -->
  <ellipse cx="700" cy="500" rx="500" ry="120" fill="url(#glowGrad)" opacity="0.2"/>

  <!-- Corner decorations with glow -->
  <g filter="url(#glow)">
    <path d="M40,40 L150,40 M40,40 L40,150" stroke="url(#cyanGrad)" stroke-width="3" fill="none" opacity="0.8"/>
    <path d="M1360,40 L1250,40 M1360,40 L1360,150" stroke="url(#cyanGrad)" stroke-width="3" fill="none" opacity="0.8"/>
    <path d="M40,460 L150,460 M40,460 L40,350" stroke="url(#cyanGrad)" stroke-width="3" fill="none" opacity="0.8"/>
    <path d="M1360,460 L1250,460 M1360,460 L1360,350" stroke="url(#cyanGrad)" stroke-width="3" fill="none" opacity="0.8"/>
  </g>

  <!-- Central animated hexagon -->
  <g transform="translate(700, 130)" filter="url(#glow)">
    <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30"
             fill="none" stroke="url(#cyanGrad)" stroke-width="3" opacity="0.9">
      <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="0,-35 30,-17 30,17 0,35 -30,17 -30,-17"
             fill="none" stroke="url(#cyanGrad)" stroke-width="2" opacity="0.5"/>
    <circle cx="0" cy="0" r="10" fill="#00f0ff" opacity="0.7">
      <animate attributeName="r" values="8;12;8" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Name text with glow -->
  <text x="700" y="260" text-anchor="middle"
        fill="#e2e8f0" font-size="42" font-weight="bold"
        font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace"
        letter-spacing="12" filter="url(#textGlow)">
    RAKSHITH RAJ S
  </text>

  <!-- Subtitle with gradient -->
  <text x="700" y="310" text-anchor="middle"
        fill="url(#cyanGrad)" font-size="16"
        font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace"
        letter-spacing="4">
    AI SYSTEMS · EMBEDDED · FULL-STACK
  </text>

  <!-- Tagline -->
  <text x="700" y="355" text-anchor="middle"
        fill="#7a8ba6" font-size="14"
        font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace"
        letter-spacing="2">
    Building systems that think and machines that move
  </text>

  <!-- Floating particles with animation -->
  <g fill="#00f0ff" filter="url(#glow)">
    <circle cx="180" cy="120" r="3" opacity="0.5">
      <animate attributeName="cy" values="120;115;120" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1220" cy="140" r="2.5" opacity="0.6">
      <animate attributeName="cy" values="140;145;140" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.4;0.8;0.4" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="400" r="2" opacity="0.4">
      <animate attributeName="cy" values="400;395;400" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1150" cy="420" r="2" opacity="0.5">
      <animate attributeName="cy" values="420;425;420" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="50" r="3" opacity="0.7">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="450" r="2" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="900" cy="450" r="2" opacity="0.4">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3.5s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Side decorative lines -->
  <g stroke="url(#cyanGrad)" stroke-width="2" opacity="0.4" filter="url(#glow)">
    <line x1="120" y1="200" x2="120" y2="300">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite"/>
    </line>
    <line x1="1280" y1="200" x2="1280" y2="300">
      <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" begin="2s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- Scanning line effect -->
  <line x1="0" y1="0" x2="1400" y2="0" stroke="url(#cyanGrad)" stroke-width="1" opacity="0.15">
    <animate attributeName="y1" values="0;500;0" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="y2" values="0;500;0" dur="10s" repeatCount="indefinite"/>
  </line>

  <!-- Tech pattern accents -->
  <g stroke="url(#cyanGrad)" stroke-width="1" fill="none" opacity="0.2">
    <circle cx="300" cy="250" r="80"/>
    <circle cx="1100" cy="250" r="80"/>
    <rect x="200" y="100" width="60" height="60"/>
    <rect x="1140" y="100" width="60" height="60"/>
  </g>

  <!-- Code bracket decorations -->
  <g stroke="url(#cyanGrad)" stroke-width="2" fill="none" opacity="0.5" filter="url(#glow)">
    <path d="M80,220 Q60,250 80,280" stroke-dasharray="4,2"/>
    <path d="M1320,220 Q1340,250 1320,280" stroke-dasharray="4,2"/>
  </g>
</svg>
