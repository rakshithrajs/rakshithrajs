<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="120" viewBox="0 0 1400 120">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0a0f1a"/>
      <stop offset="50%" style="stop-color:#0d1b2a"/>
      <stop offset="100%" style="stop-color:#0a0f1a"/>
    </linearGradient>
    <linearGradient id="footerAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#00a8cc"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="120" fill="url(#footerBg)"/>

  <!-- Wave pattern -->
  <path d="M0,60 Q175,30 350,60 T700,60 T1050,60 T1400,60 L1400,120 L0,120 Z"
        fill="url(#footerAccent)" opacity="0.1"/>

  <path d="M0,70 Q175,40 350,70 T700,70 T1050,70 T1400,70 L1400,120 L0,120 Z"
        fill="url(#footerAccent)" opacity="0.15"/>

  <!-- Dots -->
  <g fill="#00d4ff" opacity="0.5">
    <circle cx="100" cy="40" r="2"/>
    <circle cx="200" cy="50" r="1.5"/>
    <circle cx="300" cy="35" r="2"/>
    <circle cx="1100" cy="45" r="2"/>
    <circle cx="1200" cy="55" r="1.5"/>
    <circle cx="1300" cy="40" r="2"/>
  </g>

  <!-- Side accents -->
  <path d="M40,20 L40,100 M1360,20 L1360,100"
        stroke="url(#footerAccent)" stroke-width="2" opacity="0.4"/>
</svg>
